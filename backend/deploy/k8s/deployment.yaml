apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-grade-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-grade-backend
  template:
    metadata:
      labels:
        app: student-grade-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: replace-with-registry/student-grade-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: student-grade-backend-config
            - secretRef:
                name: student-grade-backend-secrets
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /app/.runtime
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
